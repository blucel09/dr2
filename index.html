<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회사 음료 주문 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 400px;
            margin: 0 auto;
        }

        .order-form {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        .order-management {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        h1 {
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2em;
            margin: 0 0 30px 0;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
            font-size: 1.1em;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .drink-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .option-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: bold;
        }

        .option-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .option-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .sub-options {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 10px;
        }

        .sub-option-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .sub-option-btn {
            padding: 10px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .sub-option-btn:hover {
            border-color: #667eea;
        }

        .sub-option-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .temperature-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .temp-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .temp-btn:hover {
            border-color: #667eea;
        }

        .temp-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .order-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .order-item {
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: #f8f9ff;
            transition: all 0.3s ease;
        }

        .order-item.completed {
            background: #f5f5f5;
            border-color: #ccc;
            opacity: 0.8;
        }

        .order-item.completed .order-name,
        .order-item.completed .order-details {
            text-decoration: line-through;
            color: #999;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .order-name {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
        }

        .order-time {
            font-size: 0.9em;
            color: #666;
        }

        .order-details {
            margin-bottom: 10px;
            color: #555;
        }

        .status-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .status-pending {
            background: #ff9800;
            color: white;
        }

        .status-making {
            background: #2196f3;
            color: white;
        }

        .status-pickup {
            background: #4caf50;
            color: white;
        }

        .status-complete {
            background: #9e9e9e;
            color: white;
            cursor: not-allowed;
        }

        .status-btn:hover:not(.status-complete) {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .hidden {
            display: none;
        }

        .sound-controls {
            margin-bottom: 20px;
            text-align: center;
        }

        .sound-btn {
            padding: 10px 20px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin: 0 5px;
        }

        .sound-btn:hover {
            background: #45a049;
        }

        .new-order-alert {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4caf50;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            font-weight: bold;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .container {
                max-width: 100%;
                padding: 10px;
            }
            
            .order-form, .order-management {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .order-list {
                max-height: 300px;
            }

            .new-order-alert {
                right: 10px;
                left: 10px;
                top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 주문 폼 -->
        <div class="order-form">
            <h1>🍹 음료 주문하기</h1>
            
            <div class="sound-controls">
                <button class="sound-btn" id="testSoundBtn" onclick="testSound()">🔊 소리 테스트</button>
            </div>
            
            <div class="form-group">
                <label for="customerName">주문자 이름</label>
                <input type="text" id="customerName" placeholder="이름을 입력하세요" required>
            </div>

            <div class="form-group">
                <label>음료 종류</label>
                <div class="drink-options">
                    <div class="option-btn" data-type="coffee">☕ 커피</div>
                    <div class="option-btn" data-type="ade">🧊 에이드</div>
                </div>
            </div>

            <!-- 커피 옵션 -->
            <div id="coffee-options" class="sub-options hidden">
                <label>커피 선택</label>
                <div class="sub-option-grid">
                    <div class="sub-option-btn" data-coffee="아메리카노">아메리카노</div>
                    <div class="sub-option-btn" data-coffee="카라멜마끼야또">카라멜마끼야또</div>
                    <div class="sub-option-btn" data-coffee="카페라떼">카페라떼</div>
                    <div class="sub-option-btn" data-coffee="카페모카">카페모카</div>
                    <div class="sub-option-btn" data-coffee="바닐라라떼">바닐라라떼</div>
                </div>
                
                <label style="margin-top: 15px;">온도 선택</label>
                <div class="temperature-options">
                    <div class="temp-btn" data-temp="Hot">🔥 Hot</div>
                    <div class="temp-btn" data-temp="Ice">🧊 Ice</div>
                </div>
            </div>

            <!-- 에이드 옵션 -->
            <div id="ade-options" class="sub-options hidden">
                <label>에이드 선택</label>
                <div class="sub-option-grid">
                    <div class="sub-option-btn" data-ade="청포도">🍇 청포도</div>
                    <div class="sub-option-btn" data-ade="레몬">🍋 레몬</div>
                    <div class="sub-option-btn" data-ade="자몽">🥭 자몽</div>
                </div>
                <p style="margin-top: 10px; color: #666; text-align: center;">모든 에이드는 Ice로 제공됩니다</p>
            </div>

            <button class="submit-btn" onclick="submitOrder()">주문하기</button>
        </div>

        <!-- 주문 관리 -->
        <div class="order-management">
            <h2>📋 주문관리 (3층)</h2>
            <div class="order-list" id="orderList">
                <p style="text-align: center; color: #666; margin-top: 50px;">주문이 없습니다.</p>
            </div>
        </div>

        <!-- 주문 완료 -->
        <div class="order-management">
            <h2>✅ 주문완료</h2>
            <div class="order-list" id="completedOrderList">
                <p style="text-align: center; color: #666; margin-top: 50px;">완료된 주문이 없습니다.</p>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'company-drink-orders';
        let orders = [];
        let selectedDrinkType = '';
        let selectedDrink = '';
        let selectedTemp = '';
        let audioContext = null;

        // 오디오 컨텍스트 초기화
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }

        // 딩동 소리 생성 함수
        function playDingDongSound() {
            try {
                const ctx = initAudioContext();
                
                // 첫 번째 소리 (딩)
                const oscillator1 = ctx.createOscillator();
                const gainNode1 = ctx.createGain();
                
                oscillator1.connect(gainNode1);
                gainNode1.connect(ctx.destination);
                
                oscillator1.frequency.setValueAtTime(800, ctx.currentTime);
                gainNode1.gain.setValueAtTime(0.5, ctx.currentTime);
                gainNode1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                
                oscillator1.start(ctx.currentTime);
                oscillator1.stop(ctx.currentTime + 0.15);
                
                // 두 번째 소리 (동) - 0.2초 후에 시작
                setTimeout(() => {
                    const oscillator2 = ctx.createOscillator();
                    const gainNode2 = ctx.createGain();
                    
                    oscillator2.connect(gainNode2);
                    gainNode2.connect(ctx.destination);
                    
                    oscillator2.frequency.setValueAtTime(600, ctx.currentTime);
                    gainNode2.gain.setValueAtTime(0.5, ctx.currentTime);
                    gainNode2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    
                    oscillator2.start(ctx.currentTime);
                    oscillator2.stop(ctx.currentTime + 0.2);
                }, 200);
                
            } catch (error) {
                console.log('소리 재생에 실패했습니다:', error);
            }
        }

        // 음성 안내 함수
        function playVoiceAlert() {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance('딩동, 주문이 들어왔습니다');
                utterance.lang = 'ko-KR';
                utterance.rate = 1.5; // 빠른 속도
                utterance.volume = 1.0; // 최대 볼륨
                
                // 딩동 소리 먼저 재생
                playDingDongSound();
                
                // 0.5초 후에 음성 안내 (더 빠르게)
                setTimeout(() => {
                    speechSynthesis.speak(utterance);
                }, 500);
            } else {
                // 음성 합성을 지원하지 않는 경우 딩동 소리만 재생
                playDingDongSound();
            }
        }

        // 소리 테스트 함수
        function testSound() {
            playVoiceAlert();
        }

        // 새 주문 알림 표시
        function showNewOrderAlert(customerName) {
            const alert = document.createElement('div');
            alert.className = 'new-order-alert';
            alert.innerHTML = `🔔 주문이 들어왔습니다!<br>${customerName}님의 주문`;
            document.body.appendChild(alert);
            
            setTimeout(() => {
                alert.remove();
            }, 3000);
        }

        // 주문 데이터 저장/불러오기
        function saveOrders() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
        }

        function loadOrders() {
            const stored = localStorage.getItem(STORAGE_KEY);
            orders = stored ? JSON.parse(stored) : [];
            renderOrderList();
        }

        // 다른 페이지/디바이스에서 변경 사항 실시간 반영
        window.addEventListener('storage', (event) => {
            if (event.key === STORAGE_KEY) {
                orders = event.newValue ? JSON.parse(event.newValue) : [];
                renderOrderList();
            }
        });

        // 음료 종류 선택
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // 모든 버튼에서 active 클래스 제거
                document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
                // 클릭된 버튼에 active 클래스 추가
                this.classList.add('active');
                
                selectedDrinkType = this.dataset.type;
                
                // 모든 서브 옵션 숨기기
                document.getElementById('coffee-options').classList.add('hidden');
                document.getElementById('ade-options').classList.add('hidden');
                
                // 선택된 타입의 옵션 보이기
                if (selectedDrinkType === 'coffee') {
                    document.getElementById('coffee-options').classList.remove('hidden');
                } else if (selectedDrinkType === 'ade') {
                    document.getElementById('ade-options').classList.remove('hidden');
                }
                
                // 선택 초기화
                selectedDrink = '';
                selectedTemp = '';
                document.querySelectorAll('.sub-option-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.temp-btn').forEach(b => b.classList.remove('active'));
            });
        });

        // 커피/에이드 선택
        document.querySelectorAll('.sub-option-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // 같은 그룹의 버튼들에서 active 클래스 제거
                const parent = this.parentElement;
                parent.querySelectorAll('.sub-option-btn').forEach(b => b.classList.remove('active'));
                // 클릭된 버튼에 active 클래스 추가
                this.classList.add('active');
                
                if (this.dataset.coffee) {
                    selectedDrink = this.dataset.coffee;
                } else if (this.dataset.ade) {
                    selectedDrink = this.dataset.ade;
                    selectedTemp = 'Ice'; // 에이드는 자동으로 Ice
                }
            });
        });

        // 온도 선택
        document.querySelectorAll('.temp-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // 모든 온도 버튼에서 active 클래스 제거
                document.querySelectorAll('.temp-btn').forEach(b => b.classList.remove('active'));
                // 클릭된 버튼에 active 클래스 추가
                this.classList.add('active');
                
                selectedTemp = this.dataset.temp;
            });
        });

        // 주문 제출
        function submitOrder() {
            const customerName = document.getElementById('customerName').value.trim();
            
            if (!customerName) {
                alert('주문자 이름을 입력해주세요.');
                return;
            }
            
            if (!selectedDrinkType) {
                alert('음료 종류를 선택해주세요.');
                return;
            }
            
            if (!selectedDrink) {
                alert('음료를 선택해주세요.');
                return;
            }
            
            if (selectedDrinkType === 'coffee' && !selectedTemp) {
                alert('온도를 선택해주세요.');
                return;
            }
            
            const today = new Date().toISOString().slice(0, 10);
            const hasOrderToday = orders.some(order =>
                order.customerName.toLowerCase() === customerName.toLowerCase() &&
                order.orderDate === today
            );

            if (hasOrderToday) {
                alert('죄송합니다 하루에 한잔만 주문가능합니다.');
                return;
            }

            // 주문 생성
            const order = {
                id: Date.now(),
                customerName: customerName,
                drinkType: selectedDrinkType,
                drink: selectedDrink,
                temperature: selectedTemp,
                status: '주문접수',
                orderTime: new Date().toLocaleString('ko-KR'),
                orderDate: today
            };
            
            orders.push(order);
            
            // 딩동 소리와 음성 안내 재생
            playVoiceAlert();
            
            // 새 주문 알림 표시
            showNewOrderAlert(customerName);
            
            // 주문 목록 즉시 업데이트
            renderOrderList();

            // 저장 및 동기화
            saveOrders();
            
            // 폼 초기화
            document.getElementById('customerName').value = '';
            selectedDrinkType = '';
            selectedDrink = '';
            selectedTemp = '';
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.sub-option-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.temp-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('coffee-options').classList.add('hidden');
            document.getElementById('ade-options').classList.add('hidden');
            
            alert('주문이 완료되었습니다!');
        }

        // 주문 목록 렌더링
        function renderOrderList() {
            const orderList = document.getElementById('orderList');
            const completedOrderList = document.getElementById('completedOrderList');
            
            if (!orderList || !completedOrderList) {
                return;
            }
            
            // 진행 중인 주문과 완료된 주문 분리
            const activeOrders = orders.filter(order => order.status !== '주문완료');
            const completedOrders = orders.filter(order => order.status === '주문완료');
            
            // 진행 중인 주문 목록 렌더링
            if (activeOrders.length === 0) {
                orderList.innerHTML = '<p style="text-align: center; color: #666; margin-top: 50px;">주문이 없습니다.</p>';
            } else {
                let activeOrderHTML = '';
                activeOrders.forEach((order, index) => {
                    activeOrderHTML += `
                        <div class="order-item">
                            <div class="order-header">
                                <div class="order-name">${order.customerName}</div>
                                <div class="order-time">${order.orderTime}</div>
                            </div>
                            <div class="order-details">
                                ${order.drink} ${order.temperature ? `(${order.temperature})` : ''}
                            </div>
                            <button class="status-btn ${getStatusClass(order.status)}" 
                                    onclick="changeOrderStatus(${order.id})">
                                ${order.status}
                            </button>
                        </div>
                    `;
                });
                orderList.innerHTML = activeOrderHTML;
            }
            
            // 완료된 주문 목록 렌더링
            if (completedOrders.length === 0) {
                completedOrderList.innerHTML = '<p style="text-align: center; color: #666; margin-top: 50px;">완료된 주문이 없습니다.</p>';
            } else {
                let completedOrderHTML = '';
                completedOrders.forEach((order, index) => {
                    completedOrderHTML += `
                        <div class="order-item completed">
                            <div class="order-header">
                                <div class="order-name">${order.customerName}</div>
                                <div class="order-time">${order.orderTime}</div>
                            </div>
                            <div class="order-details">
                                ${order.drink} ${order.temperature ? `(${order.temperature})` : ''}
                            </div>
                            <button class="status-btn status-complete" disabled>
                                ${order.status}
                            </button>
                        </div>
                    `;
                });
                completedOrderList.innerHTML = completedOrderHTML;
            }
        }

        // 상태별 CSS 클래스 반환
        function getStatusClass(status) {
            switch(status) {
                case '주문접수': return 'status-pending';
                case '만드는중': return 'status-making';
                case '픽업요망': return 'status-pickup';
                case '주문완료': return 'status-complete';
                default: return 'status-pending';
            }
        }

        // 주문 상태 변경
        function changeOrderStatus(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (!order || order.status === '주문완료') {
                return;
            }
            
            switch(order.status) {
                case '주문접수':
                    order.status = '만드는중';
                    break;
                case '만드는중':
                    order.status = '픽업요망';
                    break;
                case '픽업요망':
                    order.status = '주문완료';
                    break;
            }

            renderOrderList();
            saveOrders();
        }

        // 페이지 로드 시 오디오 컨텍스트 초기화를 위한 이벤트 리스너
        document.addEventListener('click', function initAudio() {
            initAudioContext();
            document.removeEventListener('click', initAudio);
        }, { once: true });

        // 초기 데이터 로드
        loadOrders();
    </script>
</body>
</html>
